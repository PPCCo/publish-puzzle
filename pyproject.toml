[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-clr-publishing-house"
version = "1.0.0"
description = "Deterministic support tooling for a Claude Code puzzle / coloring / journal / printable publishing-house framework"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
  "Pillow>=10.4,<13",
  "reportlab>=4.2,<6",
]

[project.optional-dependencies]
mcp = ["mcp>=1.27,<2"]
dev = ["ruff>=0.9,<1", "mypy>=1.14,<2"]

[project.scripts]
publishing-house = "publishing_house.cli:main"

[tool.setuptools]
package-dir = {"" = ".claude/scripts"}

[tool.setuptools.packages.find]
where = [".claude/scripts"]
include = ["publishing_house*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_return_any = true
strict_optional = true
